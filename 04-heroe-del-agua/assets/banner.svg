<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgw" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#012a4a"/>
      <stop offset="100%" stop-color="#014f86"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bgw)"/>

  <!-- Calles de la ciudad -->
  <g stroke="#ffffff" stroke-opacity="0.1" stroke-width="3">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
  </g>

  <!-- Gotas de agua flotando -->
  <g fill="#61dafb" opacity="0.85">
    <path d="M150 150 q10 -20 20 0 q0 12 -20 12 q-20 0 -20 -12 q10 -20 20 0"/>
    <path d="M1000 90 q8 -16 16 0 q0 10 -16 10 q-16 0 -16 -10 q8 -16 16 0"/>
    <path d="M1050 330 q9 -18 18 0 q0 11 -18 11 q-18 0 -18 -11 q9 -18 18 0"/>
  </g>

  <!-- Grifo -->
  <g transform="translate(880,150)">
    <rect x="0" y="0" width="14" height="60" fill="#b0bec5"/>
    <rect x="-20" y="-10" width="54" height="14" rx="6" fill="#b0bec5"/>
    <circle cx="7" cy="70" r="6" fill="#61dafb"/>
  </g>

  <!-- Icono "plus" power-up -->
  <g transform="translate(230,110)">
    <circle r="20" fill="#ffd23f"/>
    <rect x="-3" y="-12" width="6" height="24" fill="#1b1b1b"/>
    <rect x="-12" y="-3" width="24" height="6" fill="#1b1b1b"/>
  </g>

  <!-- Personaje heroe -->
  <g transform="translate(560,220)">
    <circle cx="30" cy="10" r="16" fill="#ffcc80"/>
    <rect x="10" y="26" width="40" height="55" rx="10" fill="#0288d1"/>
    <rect x="6" y="60" width="12" height="30" fill="#0288d1"/>
    <rect x="52" y="60" width="12" height="30" fill="#0288d1"/>
  </g>

  <!-- Basura dispersa -->
  <g fill="#8d6e63" opacity="0.8">
    <circle cx="380" cy="330" r="9"/>
    <rect x="720" y="320" width="16" height="12"/>
  </g>

  <!-- Titulo -->
  <text x="600" y="60" font-family="Segoe UI, Verdana, sans-serif" font-size="52" font-weight="800" fill="#ffffff" text-anchor="middle">Héroe del Agua</text>
  <text x="600" y="380" font-family="Segoe UI, Verdana, sans-serif" font-size="18" fill="#b3e5fc" text-anchor="middle">Cierra los grifos, cuida el agua · Evita la basura</text>
</svg>
