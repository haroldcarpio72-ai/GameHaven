  </g>

  <!-- Monedas -->
  <g>
    <circle cx="950" cy="120" r="26" fill="#ffd23f" stroke="#e0a800" stroke-width="3"/>
    <text x="950" y="128" font-family="Verdana" font-size="24" fill="#8a6d00" text-anchor="middle">$</text>
    <circle cx="1010" cy="160" r="20" fill="#ffd23f" stroke="#e0a800" stroke-width="3"/>
    <text x="1010" y="167" font-family="Verdana" font-size="18" fill="#8a6d00" text-anchor="middle">$</text>
    <circle cx="960" cy="195" r="16" fill="#ffd23f" stroke="#e0a800" stroke-width="3"/>
  </g>

  <!-- Caritas de animo -->
  <g transform="translate(400,250)">
    <circle r="24" fill="#8bc34a"/>
    <circle cx="-8" cy="-6" r="3" fill="#1b1b1b"/><circle cx="8" cy="-6" r="3" fill="#1b1b1b"/>
