  </g>

  <!-- Titulo -->
  <text x="600" y="60" font-family="Segoe UI, Verdana, sans-serif" font-size="50" font-weight="800" fill="#ffffff" text-anchor="middle">Llega a Fin de Mes</text>
  <text x="600" y="360" font-family="Segoe UI, Verdana, sans-serif" font-size="18" fill="#c8e6c9" text-anchor="middle">Simulador de decisiones económicas y estado de ánimo</text>
