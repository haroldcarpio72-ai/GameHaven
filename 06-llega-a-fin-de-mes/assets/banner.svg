  </defs>
  <rect width="1200" height="400" fill="url(#bgf)"/>

  <!-- Calendario -->
  <g transform="translate(120,110)">
    <rect x="0" y="10" width="160" height="140" rx="10" fill="#fdfdfd"/>
    <rect x="0" y="10" width="160" height="34" rx="10" fill="#2e7d32"/>
    <rect x="20" y="0" width="10" height="24" fill="#1b5e20"/>
    <rect x="130" y="0" width="10" height="24" fill="#1b5e20"/>
    <g fill="#c8e6c9">
      <rect x="14" y="56" width="18" height="14"/><rect x="42" y="56" width="18" height="14"/>
      <rect x="70" y="56" width="18" height="14"/><rect x="98" y="56" width="18" height="14"/>
      <rect x="126" y="56" width="18" height="14"/>
      <rect x="14" y="80" width="18" height="14"/><rect x="42" y="80" width="18" height="14"/>
      <rect x="70" y="80" width="18" height="14" fill="#ffd23f"/><rect x="98" y="80" width="18" height="14"/>
      <rect x="126" y="80" width="18" height="14"/>
      <rect x="14" y="104" width="18" height="14"/><rect x="42" y="104" width="18" height="14"/>
      <rect x="70" y="104" width="18" height="14"/><rect x="98" y="104" width="18" height="14"/>
      <rect x="126" y="104" width="18" height="14"/>
