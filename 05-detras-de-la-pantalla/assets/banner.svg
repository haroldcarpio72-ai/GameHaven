<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#2b2b3d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bgd)"/>

  <!-- Telefono / pantalla -->
  <g transform="translate(500,50)">
    <rect x="0" y="0" width="200" height="300" rx="24" fill="#0e0e14" stroke="#444" stroke-width="4"/>
    <rect x="14" y="24" width="172" height="252" rx="6" fill="#16161f"/>
    <!-- burbuja de burla -->
    <rect x="30" y="50" width="140" height="34" rx="10" fill="#ff5252" opacity="0.85"/>
    <text x="100" y="72" font-family="Verdana" font-size="12" fill="#ffffff" text-anchor="middle">jaja mira esto...</text>
    <!-- burbuja de apoyo -->
    <rect x="30" y="200" width="140" height="34" rx="10" fill="#4fc3f7" opacity="0.85"/>
    <text x="100" y="222" font-family="Verdana" font-size="12" fill="#ffffff" text-anchor="middle">¿Estás bien?</text>
  </g>

  <!-- Dos siluetas: acosado / acosador -->
  <g transform="translate(140,140)" fill="#4a4a5a">
    <circle cx="30" cy="20" r="20"/>
    <rect x="5" y="42" width="50" height="90" rx="14"/>
  </g>
  <text x="170" y="260" font-family="Segoe UI" font-size="14" fill="#9ea0b3" text-anchor="middle">acosado</text>

  <g transform="translate(1000,140)" fill="#5a3a3a">
    <circle cx="30" cy="20" r="20"/>
    <rect x="5" y="42" width="50" height="90" rx="14"/>
  </g>
  <text x="1030" y="260" font-family="Segoe UI" font-size="14" fill="#c99" text-anchor="middle">acosador</text>

  <!-- Titulo -->
  <text x="600" y="360" font-family="Segoe UI, Verdana, sans-serif" font-size="46" font-weight="800" fill="#ffffff" text-anchor="middle">Detrás de la Pantalla</text>
  <text x="600" y="390" font-family="Segoe UI, Verdana, sans-serif" font-size="17" fill="#9ea0b3" text-anchor="middle">Storytelling narrativo sobre ciberacoso · Dos perspectivas</text>
</svg>
