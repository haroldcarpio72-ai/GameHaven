<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#ff206e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Grid decorativo -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- Formas flotantes tipo pixel/game -->
  <rect x="80" y="60" width="26" height="26" fill="#00f5d4" opacity="0.8" rx="4"/>
  <circle cx="1100" cy="90" r="18" fill="#ff206e" opacity="0.8"/>
  <polygon points="1050,300 1080,340 1020,340" fill="#ffd23f" opacity="0.8"/>
  <rect x="150" y="320" width="20" height="20" fill="#8338ec" opacity="0.7" rx="3"/>
  <circle cx="200" cy="70" r="10" fill="#ff206e" opacity="0.6"/>
  <rect x="1000" y="200" width="16" height="16" fill="#00f5d4" opacity="0.6" rx="3"/>

  <!-- Controller icon simplificado -->
  <g transform="translate(90,150)">
    <rect x="0" y="20" width="140" height="70" rx="35" fill="#ffffff" opacity="0.08"/>
    <rect x="10" y="30" width="120" height="50" rx="25" fill="#ffffff" opacity="0.9"/>
    <circle cx="40" cy="55" r="7" fill="#302b63"/>
    <rect x="33" y="48" width="14" height="14" fill="#302b63"/>
    <circle cx="100" cy="47" r="7" fill="#ff206e"/>
    <circle cx="118" cy="55" r="7" fill="#00f5d4"/>
    <circle cx="100" cy="63" r="7" fill="#ffd23f"/>
    <circle cx="82" cy="55" r="7" fill="#8338ec"/>
  </g>

  <!-- Texto principal -->
  <text x="600" y="200" font-family="Segoe UI, Verdana, sans-serif" font-size="72" font-weight="800" fill="#ffffff" text-anchor="middle">GameHaven</text>
  <text x="600" y="240" font-family="Segoe UI, Verdana, sans-serif" font-size="24" font-weight="600" fill="url(#accent)" text-anchor="middle">GAME DEVELOPMENT PORTFOLIO</text>
  <text x="600" y="275" font-family="Segoe UI, Verdana, sans-serif" font-size="18" fill="#c9c9d9" text-anchor="middle">Prototipos y videojuegos · Introducción al Desarrollo de Videojuegos</text>

  <rect x="480" y="300" width="240" height="4" fill="url(#accent)" rx="2"/>
</svg>
