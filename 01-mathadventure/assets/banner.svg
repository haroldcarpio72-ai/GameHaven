<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0221"/>
      <stop offset="100%" stop-color="#1b0e3d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bgm)"/>

  <!-- Speed lines -->
  <g stroke="#00f5d4" stroke-opacity="0.35" stroke-width="4">
    <line x1="0" y1="60" x2="260" y2="60"/>
    <line x1="0" y1="110" x2="200" y2="110"/>
    <line x1="0" y1="340" x2="300" y2="340"/>
    <line x1="0" y1="290" x2="180" y2="290"/>
  </g>
  <g stroke="#ff206e" stroke-opacity="0.3" stroke-width="4">
    <line x1="950" y1="70" x2="1200" y2="70"/>
    <line x1="1000" y1="330" x2="1200" y2="330"/>
  </g>

  <!-- Obstaculos geometricos estilo geometry dash -->
  <polygon points="880,300 940,300 940,240" fill="#ff206e"/>
  <rect x="960" y="250" width="50" height="50" fill="#ffd23f"/>
  <polygon points="1040,300 1100,300 1100,240" fill="#00f5d4"/>

  <!-- Cubo jugador -->
  <rect x="120" y="250" width="50" height="50" rx="8" fill="#8338ec"/>
  <rect x="120" y="250" width="50" height="50" rx="8" fill="none" stroke="#ffffff" stroke-width="2"/>

  <!-- Simbolos matematicos flotando -->
  <text x="300" y="110" font-family="Verdana" font-size="40" fill="#00f5d4" opacity="0.8">+</text>
  <text x="380" y="180" font-family="Verdana" font-size="40" fill="#ffd23f" opacity="0.8">÷</text>
  <text x="250" y="200" font-family="Verdana" font-size="40" fill="#ff206e" opacity="0.8">×</text>
  <text x="450" y="100" font-family="Verdana" font-size="40" fill="#ffffff" opacity="0.6">−</text>

  <!-- Titulo -->
  <text x="600" y="230" font-family="Segoe UI, Verdana, sans-serif" font-size="64" font-weight="800" fill="#ffffff" text-anchor="middle">mathAdventure</text>
  <text x="600" y="270" font-family="Segoe UI, Verdana, sans-serif" font-size="20" fill="#a29bd6" text-anchor="middle">Velocidad + Matemática · Estilo Geometry Dash</text>
</svg>
